name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: lint · typecheck · build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
          POSTGRES_DB: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_VERSION: "20"
      POSTGRES_URL: postgres://dashboard:dashboard@localhost:5432/dashboard
      POSTGRES_PRISMA_URL: postgres://dashboard:dashboard@localhost:5432/dashboard
      POSTGRES_URL_NO_SSL: postgres://dashboard:dashboard@localhost:5432/dashboard
      POSTGRES_URL_NON_POOLING: postgres://dashboard:dashboard@localhost:5432/dashboard
      AUTH_SECRET: ci-secret-no-valido-en-produccion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Seed database
        run: npm run seed

      - name: Build
        run: npm run build